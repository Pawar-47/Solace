name: Diagnose

# The builds that found the freeze, plus the current pack, all attached to a run.
#
# When a pack freezes the game on loading and leaves nothing in the log, the only way in
# is to build a pack that is missing a family of programs and see whether it still
# freezes: Iris substitutes its own vanilla-equivalent program for anything absent, so
# each build still loads and still draws. Seven answers narrowed a six-month stall to
# one file. That is worth keeping - but a player downloading a shader pack should not
# have to read a release page full of them, so they are attached to a run instead.
#
# Everything this workflow makes is downloaded from the run's own page under Artifacts.
# It publishes no release and touches no tag.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    name: Build the diagnostic and probe zips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check before packaging
        run: |
          python3 tools/validate_pack.py
          python3 tools/check_lang.py
          python3 tools/check_textures.py

      # The pack itself, so this workflow is also how the current build is downloaded
      # while it is not yet worth a version number. Built before the diagnostic step,
      # which edits config.glsl in place.
      - name: Build the pack
        run: |
          cd Solace-LowEnd
          zip -r ../Solace-LowEnd.zip shaders README.md
          cd ..
          ls -l Solace-LowEnd.zip
          unzip -l Solace-LowEnd.zip | head -8

      - name: Build the diagnostic zip
        run: |
          sed -i 's/^#define SOLACE_DIAG 0/#define SOLACE_DIAG 1/' Solace-LowEnd/shaders/lib/config.glsl
          grep -n "SOLACE_DIAG" Solace-LowEnd/shaders/lib/config.glsl
          cd Solace-LowEnd
          zip -r ../Solace-Diagnostic.zip shaders README.md
          cd ..
          unzip -l Solace-Diagnostic.zip | head -8

      # Each probe is a single yes/no answer, and the answers are only meaningful
      # together. PostOnly keeps the post chain and drops the geometry; NoFinal and
      # NoPrepare drop exactly one program from the whole pack.
      - name: Build the PostOnly probe
        run: |
          rm -rf probe-post && cp -r Solace-LowEnd probe-post
          find probe-post/shaders -name 'gbuffers_*.fsh' -delete
          find probe-post/shaders -name 'gbuffers_*.vsh' -delete
          find probe-post/shaders -name 'dh_*.fsh' -delete
          find probe-post/shaders -name 'dh_*.vsh' -delete
          find probe-post/shaders -name 'voxy_*' -delete
          ( cd probe-post && zip -r ../Solace-Probe-PostOnly.zip shaders README.md )
          unzip -l Solace-Probe-PostOnly.zip | tail -3

      # The pack has no prepare program any more: it was the only program present in
      # every configuration that froze and absent from every one that ran, and all it
      # did was paint the horizon colour behind the world. That leaves final as the one
      # program still unisolated, so this probe drops exactly that file.
      - name: Build the NoFinal probe
        run: |
          rm -rf nofinal && cp -r Solace-LowEnd nofinal
          find nofinal/shaders -name 'final.*' -delete
          ( cd nofinal && zip -r ../Solace-Probe-NoFinal.zip shaders README.md )
          unzip -l Solace-Probe-NoFinal.zip | tail -3

      # The narrowest post chain possible: no geometry programs and none of the four
      # effect passes, so `final` is the only program of ours that runs. If this loads,
      # the freeze is in one of the four passes that are switched off by their
      # `program.*.enabled` lines; if it freezes, `final` is the file.
      - name: Build the PostFinalOnly probe
        run: |
          rm -rf postfinal && cp -r Solace-LowEnd postfinal
          find postfinal/shaders -name 'gbuffers_*' -delete
          find postfinal/shaders -name 'dh_*' -delete
          find postfinal/shaders -name 'voxy_*' -delete
          find postfinal/shaders -name 'composite.*' -delete
          find postfinal/shaders -name 'composite2.*' -delete
          find postfinal/shaders -name 'deferred.*' -delete
          find postfinal/shaders -name 'shadow.*' -delete
          ( cd postfinal && zip -r ../Solace-Probe-PostFinalOnly.zip shaders README.md )
          unzip -l Solace-Probe-PostFinalOnly.zip | tail -3

      - name: Attach the builds to this run
        uses: actions/upload-artifact@v4
        with:
          name: Solace-diagnostic-and-probes
          path: |
            Solace-LowEnd.zip
            Solace-Diagnostic.zip
            Solace-Probe-*.zip
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "Builds attached to this run."
            echo ""
            echo "Solace-LowEnd - the current pack."
            echo "Solace-Diagnostic - the whole pack with the last pass bypassed. Flat and wrong on purpose."
            echo "Solace-Probe-PostOnly - no gbuffers programs: vanilla draws, the pack only post-processes."
            echo "Solace-Probe-NoFinal - the whole pack minus final.fsh and final.vsh."
            echo "Solace-Probe-PostFinalOnly - final and nothing else that runs: no geometry, no composite, no deferred, no shadow."
            echo ""
            echo "One answer each: does it load or does it freeze. Read together they name a file."
          } >> "$GITHUB_STEP_SUMMARY"
