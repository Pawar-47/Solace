name: Diagnose

# The builds that find a freeze, all attached to one run.
#
# A pack that freezes the game on loading and leaves nothing in the log can only be
# narrowed by building packs that are missing one thing and seeing whether they still
# freeze: Iris substitutes its own vanilla-equivalent program for anything absent, so
# each build still loads and still draws.
#
# This round asks one question per post-chain program. Everything else in the pack is
# identical between the four zips, so whichever *removal* makes the game load names the
# file. That is as close to a controlled experiment as this can get without a GPU here.
#
# Everything this workflow makes is downloaded from the run's own page under Artifacts.
# It publishes no release and touches no tag.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    name: Build the diagnostic and probe zips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check before packaging
        run: |
          python3 tools/validate_pack.py
          python3 tools/check_lang.py
          python3 tools/check_textures.py

      # The pack itself, so this workflow is also how the current build is downloaded
      # while it is not yet worth a version number. Built before the steps below, which
      # edit the copy in place.
      - name: Build the pack
        run: |
          cd Solace-LowEnd
          zip -r ../Solace-LowEnd.zip shaders README.md
          cd ..
          ls -l Solace-LowEnd.zip

      - name: Build the diagnostic zip
        run: |
          rm -rf diag && cp -r Solace-LowEnd diag
          sed -i 's/^#define SOLACE_DIAG 0/#define SOLACE_DIAG 1/' diag/shaders/lib/config.glsl
          grep -n "SOLACE_DIAG" diag/shaders/lib/config.glsl
          ( cd diag && zip -r ../Solace-Diagnostic.zip shaders README.md )
          ls -l Solace-Diagnostic.zip

      # One zip per post-chain program, each the whole pack minus exactly that program.
      # If one of them loads, that file is the freeze.
      - name: Build one probe per post program
        run: |
          for prog in prepare deferred composite composite2 final; do
            rm -rf "probe-$prog"
            cp -r Solace-LowEnd "probe-$prog"
            find "probe-$prog/shaders" -name "$prog.fsh" -delete
            find "probe-$prog/shaders" -name "$prog.vsh" -delete
            ( cd "probe-$prog" && zip -r "../Solace-Probe-No-$prog.zip" shaders README.md )
            echo "--- $prog removed ---"
            unzip -l "Solace-Probe-No-$prog.zip" | tail -2
          done

      - name: Attach the builds to this run
        uses: actions/upload-artifact@v4
        with:
          name: Solace-diagnostic-and-probes
          path: |
            Solace-LowEnd.zip
            Solace-Diagnostic.zip
            Solace-Probe-*.zip
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "Builds attached to this run."
            echo ""
            echo "Solace-LowEnd - the current pack."
            echo "Solace-Diagnostic - the whole pack with the last pass bypassed. Flat and wrong on purpose."
            echo ""
            echo "Solace-Probe-No-prepare     - the pack minus prepare.fsh/.vsh"
            echo "Solace-Probe-No-deferred    - the pack minus deferred.fsh/.vsh"
            echo "Solace-Probe-No-composite   - the pack minus composite.fsh/.vsh"
            echo "Solace-Probe-No-composite2  - the pack minus composite2.fsh/.vsh"
            echo "Solace-Probe-No-final       - the pack minus final.fsh/.vsh"
            echo ""
            echo "Load them in that order until one runs. The one that runs names the file."
          } >> "$GITHUB_STEP_SUMMARY"
