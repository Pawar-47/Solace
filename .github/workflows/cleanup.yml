name: Delete every release

# A one-time reset, and deliberate about it.
#
# A release page is what a player reads before trusting a download. This repository's
# had a rolling "latest" that was rewritten on every push, sixteen diagnostic zips and
# no version number anywhere - an accurate history of a debugging session, and no use
# at all to someone who just wants the pack.
#
# This deletes every release, every tag and every workflow artifact, and nothing else.
# Branches, commits and the working tree are untouched, so the code is exactly where it
# was; only the labels and the per-run files on top of it go. Run it once, then publish
# the first real version with the Release workflow.
#
# It insists on the confirmation word, because the alternative - deleting sixteen
# releases because a box was left empty - is not recoverable.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type delete-all-releases to confirm'
        required: true
        default: ""
      keep_tag:
        description: 'Tag to keep, if any. Leave empty to delete every tag'
        required: false
        default: ""
  # Or by committing this file, which is how a run is started from somewhere that cannot
  # click a workflow box. Touching it again would run the clean-up again, so the trigger
  # is removed once it has done its job.
  push:
    branches: [main]
    paths: [".github/run-cleanup"]

permissions:
  contents: write
  actions: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  delete:
    name: Delete releases and tags
    runs-on: ubuntu-latest
    steps:
      - name: Confirm
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Started by a commit to .github/run-cleanup."
            exit 0
          fi
          if [ "${{ github.event.inputs.confirm }}" != "delete-all-releases" ]; then
            echo "::error::Type delete-all-releases in the confirmation box. Nothing was deleted."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every release
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.event.inputs.keep_tag }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' > releases.txt
          echo "Releases found: $(grep -c . releases.txt || true)"
          while read -r tag; do
            [ -z "$tag" ] && continue
            if [ -n "$KEEP" ] && [ "$tag" = "$KEEP" ]; then
              echo "keeping release $tag, as asked"
              continue
            fi
            echo "deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done < releases.txt

      - name: Delete every tag left on the remote
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.event.inputs.keep_tag }}
        run: |
          git ls-remote --tags origin \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' \
            | grep -v '\^{}$' > tags.txt || true
          echo "Tags found: $(grep -c . tags.txt || true)"
          while read -r tag; do
            [ -z "$tag" ] && continue
            if [ -n "$KEEP" ] && [ "$tag" = "$KEEP" ]; then
              echo "keeping tag $tag, as asked"
              continue
            fi
            echo "deleting tag $tag"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true
          done < tags.txt

      # Artifacts are the per-run zips and logs under the Actions tab: not part of a
      # release, but still files anyone can download, and they are what accumulates into
      # hundreds of megabytes over a debugging session. Every one of them goes.
      - name: Delete every artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' > artifacts.txt || true
          echo "Artifacts found: $(grep -c . artifacts.txt || true)"
          while read -r id; do
            [ -z "$id" ] && continue
            echo "deleting artifact $id"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done < artifacts.txt

      - name: Summary
        run: |
          {
            echo "Every release, tag and workflow artifact deleted. Branches, commits and"
            echo "workflow run logs untouched."
            echo ""
            echo "Next: run the Release workflow with the version input set to 1.0.0."
            echo "It creates the tag and the release together and publishes one zip."
          } >> "$GITHUB_STEP_SUMMARY"
