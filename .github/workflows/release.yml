name: Release

# Packaging. A player needs exactly one thing from this repository: a zip with
# `shaders/` at its top level, ready to drop into `shaderpacks/`.
#
# Every push to main publishes a rolling release tagged `latest`, so there is always
# something to download without anyone having to create a tag first. Pushing a
# version tag (`v1.0.0`) publishes a release of its own with generated notes.
#
# Two zips are built. The second one is the diagnostic build: the same source with
# SOLACE_DIAG set to 1, which bypasses the post chain and switches the sky fill off,
# so a frame is the geometry and a copy of it. Loading it answers whether a freeze is
# in the post chain or in the geometry stages. ERRORS.txt travels with every release
# and says what to send when something goes wrong and where the game keeps its log.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  package:
    name: Check and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check before packaging
        run: |
          python3 tools/validate_pack.py
          python3 tools/check_lang.py
          python3 tools/check_textures.py

      - name: Build the zip
        run: |
          cd Solace-LowEnd
          zip -r ../Solace-LowEnd.zip shaders README.md
          cd ..
          ls -l Solace-LowEnd.zip
          unzip -l Solace-LowEnd.zip | head -8

      # Built from the same source, after the normal zip is safely on disk, so the
      # sed below can only affect this one.
      - name: Build the diagnostic zip
        run: |
          sed -i 's/^#define SOLACE_DIAG 0/#define SOLACE_DIAG 1/' Solace-LowEnd/shaders/lib/config.glsl
          grep -n "SOLACE_DIAG" Solace-LowEnd/shaders/lib/config.glsl
          cd Solace-LowEnd
          zip -r ../Solace-Diagnostic.zip shaders README.md
          cd ..
          ls -l Solace-Diagnostic.zip
          unzip -l Solace-Diagnostic.zip | head -8

      # Two probe zips, built from the same source.

      # Iris substitutes its own vanilla-equivalent program for any program whose files
      # are missing, so a pack built by deleting a whole family of programs still loads
      # and still draws - it just draws that family the way vanilla does. That makes
      # each probe a single yes/no answer about half the pack, which is the only thing
      # available for a stall that leaves nothing in the log.
      #
      #   Solace-Probe-PostOnly   no gbuffers_* anywhere: the post chain runs against
      #                           vanilla geometry. Loads  -> a gbuffers stage is at
      #                           fault.  Freezes -> prepare/final/pipeline is at fault.
      #   Solace-Probe-Geometry   no prepare, composite, composite2, deferred, final or
      #                           shadow: the raw geometry buffer goes to the screen.
      #                           Loads -> one of those six is at fault.  Freezes -> a
      #                           gbuffers stage or final is at fault.
      #
      # Read together, the two answers name a file family without a single log line.
      - name: Build the probe zips
        run: |
          rm -rf probe-post && cp -r Solace-LowEnd probe-post
          find probe-post/shaders -name 'gbuffers_*.fsh' -delete
          find probe-post/shaders -name 'gbuffers_*.vsh' -delete
          find probe-post/shaders -name 'dh_*.fsh' -delete
          find probe-post/shaders -name 'dh_*.vsh' -delete
          find probe-post/shaders -name 'voxy_*' -delete
          ( cd probe-post && zip -r ../Solace-Probe-PostOnly.zip shaders README.md )
          unzip -l Solace-Probe-PostOnly.zip | tail -3

          rm -rf probe-geom && cp -r Solace-LowEnd probe-geom
          find probe-geom/shaders -name 'prepare.*' -delete
          find probe-geom/shaders -name 'composite.*' -delete
          find probe-geom/shaders -name 'composite2.*' -delete
          find probe-geom/shaders -name 'deferred.*' -delete
          find probe-geom/shaders -name 'final.*' -delete
          find probe-geom/shaders -name 'shadow.*' -delete
          ( cd probe-geom && zip -r ../Solace-Probe-Geometry.zip shaders README.md )
          unzip -l Solace-Probe-Geometry.zip | tail -3

      # Two bare probes. Both previous probes froze, so the fault is in what they
      # still share: the shared libraries and the property files. These two separate
      # those, because they are the smallest a pack can be.

      #   Solace-Probe-Bare        two files, a pass-through final and nothing else -
      #                            no properties, no lang, no config, no block lists.
      #                            Freezes -> none of our GLSL is involved and the
      #                            problem is the pack shape or the driver on this
      #                            machine, and the next step is comparing against a
      #                            pack that works there.
      #                            Runs    -> our files are the difference, go on.
      #   Solace-Probe-BareConfig  the same two files plus shaders.properties, lang/
      #                            and the four .properties lists.
      #                            Bare runs and this freezes -> the configuration
      #                            files are at fault, not the GLSL.
      #                            Both run -> the fault is in the shared libs.
      - name: Build the bare probes
        run: |
          rm -rf bare && mkdir -p bare/shaders
          cat > bare/shaders/final.vsh <<'EOF'
          #version 120
          varying vec2 texcoord;
          void main() {
              gl_Position = ftransform();
              texcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
          }
          EOF
          cat > bare/shaders/final.fsh <<'EOF'
          #version 120
          uniform sampler2D colortex0;
          varying vec2 texcoord;
          void main() {
              gl_FragData[0] = texture2D(colortex0, texcoord);
          }
          EOF
          ( cd bare && zip -r ../Solace-Probe-Bare.zip shaders )
          unzip -l Solace-Probe-Bare.zip | tail -6

          rm -rf bareconfig && cp -r bare bareconfig
          cp Solace-LowEnd/shaders/shaders.properties bareconfig/shaders/
          cp -r Solace-LowEnd/shaders/lang bareconfig/shaders/lang
          cp Solace-LowEnd/shaders/block.properties bareconfig/shaders/
          cp Solace-LowEnd/shaders/item.properties bareconfig/shaders/
          cp Solace-LowEnd/shaders/entity.properties bareconfig/shaders/
          cp Solace-LowEnd/shaders/dimension.properties bareconfig/shaders/
          ( cd bareconfig && zip -r ../Solace-Probe-BareConfig.zip shaders )
          unzip -l Solace-Probe-BareConfig.zip | tail -6

      - name: Attach it to this run
        uses: actions/upload-artifact@v4
        with:
          name: Solace-LowEnd
          path: Solace-LowEnd.zip
          if-no-files-found: error

      - name: Attach the diagnostic build to this run
        uses: actions/upload-artifact@v4
        with:
          name: Solace-Diagnostic
          path: Solace-Diagnostic.zip
          if-no-files-found: error

      - name: Publish the rolling release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="$(date -u +%Y-%m-%d) at $(date -u +%H:%M) UTC"
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Solace - latest build" \
            --notes "Placeholder" \
            --latest
          gh release upload latest Solace-LowEnd.zip Solace-Diagnostic.zip \
            Solace-Probe-PostOnly.zip Solace-Probe-Geometry.zip \
            Solace-Probe-Bare.zip Solace-Probe-BareConfig.zip ERRORS.txt --clobber
          gh release edit latest \
            --notes "Download Solace-LowEnd.zip and copy the zip itself into your shaderpacks folder, then pick it in Options - Video Settings - Shader Packs. Do not unpack it: the zip already has shaders/ at its top level, which is what Iris expects. If you would rather have a folder, unpack it and rename the result to Solace-LowEnd so the game finds shaderpacks/Solace-LowEnd/shaders/.

          THE FREEZE IS FIXED IN THIS BUILD, and the probe results named it. The antialiasing pass read its history buffer and wrote it again inside the same draw. That is undefined behaviour, and undefined on an Intel driver is a hung GPU: a frozen game with nothing in the log. The flag meant to switch that pass off was written in a form that leaves a pass enabled when the expression cannot be evaluated, so the pass ran in every profile, which is why no profile helped. The history buffer and the exposure buffer are now flipped, so the read and the write are different physical buffers, and the pass switches are written in the plain form this package has always been able to evaluate. The last pass also no longer asks for GL_ARB_shader_texture_lod, which a core-profile driver does not advertise as an extension.

          For the record, the four probe results this build rests on: Bare, BareConfig and Geometry ran; PostOnly froze. PostOnly was the only one of the four that contained both composite2.fsh and shaders.properties, which is exactly the pair above.

          If it still freezes, the same four probes are attached and the same test applies.

          If the pack freezes the game, four probe zips say where. Each one either runs or freezes; nothing else to read.

          Bare: two files, a pass-through final and no configuration at all. If this freezes, none of the pack's GLSL is involved and the next step is comparing against a pack that does work on your machine. If it runs, the pack's own files are the difference.

          BareConfig: the same two files plus the properties file, the languages and the four block/item/entity/dimension lists. If Bare runs and this freezes, the configuration is at fault and not the shaders. If both run, the fault is in the shared libraries.

          PostOnly: no gbuffers programs, so vanilla draws and the pack only post-processes. Geometry: no prepare, composite, composite2, deferred, final or shadow, so the raw geometry buffer goes to the screen. Used together they name which half of the pipeline stalls, which is how the two bare probes above were chosen.

          Kernel log: the decisive line for a freeze is not in the game log. After the freeze run 'journalctl -k -b | grep -iE \"gpu hang|i915|reset\"'. A hang or reset there means the driver died on a shader; silence means the stall is in the game, not the GPU.

          ERRORS.txt says which log to send and where the game keeps it.

          Built from ${GITHUB_SHA:0:7} on ${stage}, after the pack passed its structural checks and every stage compiled under every profile. Nobody has looked at the picture on real hardware yet."

      - name: Publish a versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create \
            "${GITHUB_REF_NAME}" \
            --title "Solace ${GITHUB_REF_NAME}" \
            --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            Solace-LowEnd.zip Solace-Diagnostic.zip \
            Solace-Probe-PostOnly.zip Solace-Probe-Geometry.zip \
            Solace-Probe-Bare.zip Solace-Probe-BareConfig.zip ERRORS.txt --clobber
