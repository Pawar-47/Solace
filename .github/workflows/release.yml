name: Release

# Two kinds of release, kept apart.
#
#   Versions  - `1.0.0` and so on. Cut from a `v*` tag, or by hand with a version number.
#               Each is a build that passed every check, is never rewritten, and is the
#               one to point a player at.
#
#   Preview   - one release named `preview`, published only when this workflow is run by
#               hand with the version box left empty. It is not rewritten by a push: the
#               release page carries versions, and a test build is something you ask for.
#               It is labelled a pre-release and says what commit it was built from. It is
#               never the one to recommend.
#
# Both gate on every check, including the compiler, before anything is published. A
# preview that fails the checks is not published, so the preview is never a build that
# cannot load.

on:
  push:
    tags: ["v*"]
    # A version can also be published by committing its number to this file. That is how
    # a release is cut from here, where nothing can type in a workflow box or create a
    # tag by hand: the commit is the trigger, and the file says which version.
    branches: [main]
    paths: [".github/release-version"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v. For example 1.0.0. Leave empty to publish a preview instead."
        required: false
        default: ""
      prerelease:
        description: "Publish a version as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, and never cancel one halfway through: a half-published release
# is worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Check, package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The notes list the commits since the previous version, so the tags have to be here.
          fetch-depth: 0

      # After the checkout, not before it: the version a push publishes is read from a file
      # in the repository, and until the checkout runs there is no repository to read it
      # from. This step used to sit first, so every push found no file and published a
      # preview instead of the version it was asked for.
      - name: Decide what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          file_version=""
          if [ -f .github/release-version ]; then
            file_version="$(grep -v '^[[:space:]]*#' .github/release-version | tr -d ' \t\r\n')"
          fi

          if [ "$EVENT" = "push" ] && [ "${REF#refs/tags/}" != "$REF" ]; then
            tag="${REF#refs/tags/}"
            kind=version
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            raw="${INPUT_VERSION#v}"
            if ! printf '%s' "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::A version has to look like 1.2.3, and '$INPUT_VERSION' does not."
              exit 1
            fi
            tag="v$raw"
            kind=version
          elif [ "$EVENT" = "push" ] && [ -n "$file_version" ]; then
            raw="${file_version#v}"
            if ! printf '%s' "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::.github/release-version has to hold a version like 1.2.3, and it holds '$file_version'."
              exit 1
            fi
            tag="v$raw"
            kind=version
          else
            tag=preview
            kind=preview
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Publishing $kind as $tag"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install glslang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools

      # Gated on every check, so a release is never a build that cannot load: three
      # earlier builds could not, and the compiler is the check that would have caught two.
      - name: Every check
        run: |
          python3 tools/validate_pack.py
          python3 tools/check_lang.py
          python3 tools/check_textures.py
          python3 tools/compile_check.py

      - name: Build the zip
        run: |
          cd Solace-LowEnd
          zip -r ../Solace-LowEnd.zip shaders README.md
          cd ..
          ls -l Solace-LowEnd.zip
          unzip -l Solace-LowEnd.zip | head -8

      - name: Write the notes
        env:
          KIND: ${{ steps.plan.outputs.kind }}
        run: |
          {
            if [ "$KIND" = "preview" ]; then
              echo "**Preview.** The current build of \`main\`, rewritten on every push. Not a version,"
              echo "and it can change under you. For a version, use the release list above."
              echo ""
              echo "Built from \`${GITHUB_SHA:0:7}\` on $(date -u +%Y-%m-%d) at $(date -u +%H:%M) UTC."
              echo ""
            fi
            echo "Install: copy \`Solace-LowEnd.zip\` itself into your \`shaderpacks\` folder"
            echo "and pick it in Options - Video Settings - Shader Packs. Do not unpack it;"
            echo "the zip already has \`shaders/\` at its top level, which is what Iris reads."
            echo "If you would rather have a folder, unpack it and rename the result to"
            echo "Solace-LowEnd, so the game finds \`shaderpacks/Solace-LowEnd/shaders/\`."
            echo ""
            echo "Pack name in the list: **Solace LowEnd**. Start on the \`Smooth\` profile."
            echo ""
            echo "## Changes"
            echo ""
            if [ "$KIND" = "preview" ]; then
              previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
              to="HEAD"
            else
              previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
              to="${GITHUB_SHA}"
            fi
            if [ -n "$previous" ]; then
              echo "Since \`$previous\`:"
              echo ""
              git log --no-merges --pretty='- %s' "$previous..$to"
            else
              echo "Every commit on main. The reasons are in CHANGELOG.md."
              echo ""
              git log --no-merges --pretty='- %s' "$to"
            fi
            echo ""
            echo "Every stage of every program compiles under all seven option sets, and"
            echo "the pack passed its structural checks, before this was published."
          } > NOTES.md
          head -40 NOTES.md

      - name: Publish a preview
        if: steps.plan.outputs.kind == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The preview is one release that is replaced, not one that accumulates.
          # Deleting it and creating it again keeps the notes and the zip in step.
          gh release delete preview --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create preview \
            --title "Solace preview (latest main)" \
            --notes-file NOTES.md \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --latest=false
          gh release upload preview Solace-LowEnd.zip ERRORS.txt --clobber
          {
            echo "Published the preview from ${GITHUB_SHA:0:7}."
            echo ""
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/preview"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish a version
        if: steps.plan.outputs.kind == 'version'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
          EVENT: ${{ github.event_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already published. Bump the version instead of republishing it."
            exit 1
          fi

          args=(--title "Solace ${TAG#v}" --notes-file NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          # Only when the tag is being created here. A pushed tag already points at its commit.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            args+=(--target "${GITHUB_SHA}")
          fi

          gh release create "$TAG" "${args[@]}"
          gh release upload "$TAG" Solace-LowEnd.zip ERRORS.txt

          # A version supersedes the test build, so the release page carries versions only.
          gh release delete preview --yes --cleanup-tag >/dev/null 2>&1 || true

          {
            echo "Published $TAG."
            echo ""
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
