name: Validate shader pack

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Structure, options and texture generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Structural checks
        run: python3 tools/validate_pack.py

      - name: Generate the pack textures
        working-directory: Solace-LowEnd/shaders/textures
        run: |
          python3 generate_textures.py
          python3 - <<'PY'
          import struct, sys
          for name, width, height in [("noise.png", 256, 256),
                                      ("clouds.png", 512, 512),
                                      ("clouds_blocky.png", 512, 512)]:
              with open(name, "rb") as handle:
                  head = handle.read(33)
              if head[:8] != b"\x89PNG\r\n\x1a\n":
                  sys.exit("%s is not a PNG" % name)
              if head[12:16] != b"IHDR":
                  sys.exit("%s has no IHDR" % name)
              got = struct.unpack(">II", head[16:24])
              if got != (width, height):
                  sys.exit("%s is %dx%d, expected %dx%d" % ((name,) + got + (width, height)))
              print("%s ok, %dx%d" % ((name,) + got))
          PY

      - name: Confirm option and language counts agree
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path("Solace-LowEnd/shaders")
          text = (root / "lib" / "config.glsl").read_text(encoding="utf-8")
          options = set(re.findall(r"^#define\s+(\w+)\s+[^\s/]+\s*//\s*\[", text, re.M))
          lang = (root / "lang" / "en_US.lang").read_text(encoding="utf-8")
          named = set(re.findall(r"^option\.(\w+)(?:\.comment)?=", lang, re.M))
          missing = sorted(options - named)
          extra = sorted(named - options)
          print("options: %d, named in en_US: %d" % (len(options), len(named)))
          if missing:
              sys.exit("options without a name: %s" % ", ".join(missing))
          if extra:
              sys.exit("names without an option: %s" % ", ".join(extra))
          PY
