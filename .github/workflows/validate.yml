name: Validate shader pack

# The pack ships no build system: it is GLSL that Iris and OptiFine read at load
# time. What can be checked without a GPU is structure - an include that points
# nowhere, an unbalanced #if, an option with no name - plus the texture generator,
# whose output is generated rather than committed. That is this workflow.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Structure, options and textures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Include graph, preprocessor balance, program pairs, DRAWBUFFERS
        run: python3 tools/validate_pack.py

      - name: Options against the language files
        run: python3 tools/check_lang.py

      - name: Texture generator
        run: python3 tools/check_textures.py

      # A real GLSL front end, on the expanded source, under every profile. This is the
      # check that would have caught the two releases that could not load.
      - name: Install glslang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools

      - name: Every stage compiles
        run: python3 tools/compile_check.py

      - name: Summary
        if: always()
        run: |
          echo "Shader pack structure validated." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A failure means a file the game would refuse to load, or a setting" >> "$GITHUB_STEP_SUMMARY"
          echo "that would appear in the options screen as a raw identifier." >> "$GITHUB_STEP_SUMMARY"
