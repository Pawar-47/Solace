# Solace - shaders.properties
#
# Written for Iris 1.5.1 and newer, and for OptiFine on the same versions of
# Minecraft. Everything this file names has to exist as a define in
# lib/config.glsl; everything in lib/config.glsl with a bracket comment shows
# up on the screen defined below.

# ---- Profiles -------------------------------------------------------------
# A ladder for one machine - an i3-5005U with an HD 5500 - from "holds 60" to "uses
# everything the pack has". Every value here is one the options screen offers.

# Potato: the cheapest pack that still looks like a shaded pack. No waves, nothing
# reflected, no waving, flat grading, tone curve off. For 1366x768 on the iGPU.
profile.Potato=      WATER_WAVES=0 WATER_REFLECTION=0 WATER_GLINT=0 WATER_TEXTURE=0 REFRACTION=0 WATER_SSR=0 WAVING=0 SUN_SHADING=0 HAND_LIGHT=0 MATERIAL_GLOSS=0 EMISSIVE_GLOW=1 FOG_DENSITY=0.8 SKY_STARS=0 SKY_SUN_GLOW=0 DITHER=0 TONEMAP=0 EXPOSURE=1.05 SATURATION=1.00 CONTRAST=1.00 AVOID_DARK_LEVEL=0.045 AA_TYPE=0 AO=0 BLOOM=0 DOF=0 SHADOWS=0 V_CLOUDS=0 VOL_LIGHT=0 AUTO_EXPOSURE=0 CHROMA_ABER=0 IMAGE_SHARPENING=0

# LowEnd: what this pack was written for. Waving, gloss, stars, the tone curve and
# holo-free grading - but no water effects at all, which is where the fill rate goes.
profile.LowEnd=      WATER_WAVES=0 WATER_REFLECTION=0 WATER_GLINT=0 WATER_TEXTURE=1 WAVING=1 WAVE_STRENGTH=0.7 SUN_SHADING=1 MATERIAL_GLOSS=1 GLOSS_STRENGTH=0.45 EMISSIVE_GLOW=1 FOG_DENSITY=1.0 SKY_STARS=1 SKY_SUN_GLOW=1 DITHER=1 TONEMAP=1 EXPOSURE=1.05 SATURATION=1.06 CONTRAST=1.02 AVOID_DARK_LEVEL=0.045 AA_TYPE=0 AO=0 BLOOM=0 DOF=0 SHADOWS=0 V_CLOUDS=0 VOL_LIGHT=0 AUTO_EXPOSURE=0

# Default: water comes alive - ripples, the sky reflection and the sun glint. Still
# no extra passes, so the frame cost barely moves from LowEnd.
profile.Default=     WATER_WAVES=1 WATER_REFLECTION=1 WATER_GLINT=1 WATER_TEXTURE=1 WAVING=1 SUN_SHADING=1 MATERIAL_GLOSS=1 EMISSIVE_GLOW=1 FOG_DENSITY=1.0 SKY_STARS=1 SKY_SUN_GLOW=1 DITHER=1 TONEMAP=1 EXPOSURE=1.05 SATURATION=1.06 CONTRAST=1.02 AVOID_DARK_LEVEL=0.045 AA_TYPE=0 AO=0 BLOOM=0 DOF=0 SHADOWS=0 V_CLOUDS=0 VOL_LIGHT=0 AUTO_EXPOSURE=0

# Beauty: the same frame, graded warmer and slower, with temporal AA on. For someone
# who would rather look at the picture than at the framerate counter.
profile.Beauty=      WATER_WAVES=1 WAVE_SPEED=0.8 WATER_REFLECTION=1 WATER_GLINT=1 WATER_TEXTURE=1 WAVING=1 WAVE_STRENGTH=1.0 SUN_SHADING=1 MATERIAL_GLOSS=1 GLOSS_STRENGTH=0.60 EMISSIVE_GLOW=1 FOG_DENSITY=1.0 SKY_STARS=1 SKY_SUN_GLOW=1 DITHER=1 TONEMAP=1 EXPOSURE=1.15 SATURATION=1.10 CONTRAST=1.02 AA_TYPE=1 TAA_WEIGHT=0.88 AO=0 BLOOM=0 DOF=0 SHADOWS=0 V_CLOUDS=0 VOL_LIGHT=0 AUTO_EXPOSURE=0

# PerformancePlus: everything the pack can do, each effect at its cheapest sample
# count instead of switched off. 512 px shadows over 75 blocks with hard taps, four
# steps of reflections and clouds, four AO taps, three samples of shafts and motion
# blur, four of depth of field, slow auto exposure. The heavy end - it exists so no
# effect has to be dropped to save frame time.
profile.PerformancePlus= SHADOWS=1 SHADOW_QTY_SLIDER=1 SHADOW_DISTANCE_SLIDER=0 SHADOW_SOFT=0 SHADOW_BLUR=0.5 V_CLOUDS=1 CLOUD_STEPS=4 CLOUD_COVERAGE=0.42 WATER_WAVES=1 WATER_REFLECTION=1 WATER_GLINT=1 WATER_SSR=1 SSR_STEPS=4 REFRACTION=1 WATER_ABSORPTION=0.10 AO=1 AO_STRENGTH=0.45 AO_RADIUS=0.030 AO_TAPS=4 BLOOM=1 BLOOM_STRENGTH=0.09 BLOOM_RADIUS=1.0 DOF=1 DOF_STRENGTH=0.05 DOF_SAMPLES=4 AA_TYPE=1 TAA_WEIGHT=0.93 MOTION_BLUR=1 MOTION_BLUR_SAMPLES=3 MOTION_BLUR_STRENGTH=0.5 AUTO_EXPOSURE=1 AUTO_EXPOSURE_SPEED=0.05 VOL_LIGHT=1 VOL_LIGHT_SAMPLES=3 VOL_LIGHT_STRENGTH=0.40 WAVING=1 WAVE_STRENGTH=0.7 MATERIAL_GLOSS=1 GLOSS_STRENGTH=0.45 EMISSIVE_GLOW=1 DITHER=1 CHROMA_ABER=0 IMAGE_SHARPENING=0 EXPOSURE=1.05

# ---- Options screen -------------------------------------------------------
# Grouped into sub-screens: 94 entries on one page are a wall, and nobody scrolls
# past the water sliders to find the fog.
screen.columns = 2
screen = <profile> COLOR_SCHEME WATER_WAVES SHADOWS AO AA_TYPE PACK_TEXTURES <empty> [ADVANCED_SCREEN]

screen.ADVANCED_SCREEN.columns = 3
screen.ADVANCED_SCREEN = [WATER_SCREEN] [GEOMETRY_SCREEN] [SHADOW_SCREEN] [SKY_SCREEN] [AO_SCREEN] [BLOOM_SCREEN] [DOF_SCREEN] [AA_SCREEN] [MOTION_BLUR_SCREEN] [LIGHT_SCREEN] [FOG_SCREEN] [COLOUR_SCREEN] [PALETTE_SCREEN] [ACCESSIBILITY_SCREEN]

screen.WATER_SCREEN = WATER_WAVES WAVE_SPEED WAVE_SCALE WATER_OPACITY WATER_REFLECTION WATER_GLINT WATER_SSR SSR_STEPS REFRACTION WATER_ABSORPTION WATER_TEXTURE VANILLA_WATER
screen.GEOMETRY_SCREEN = WAVING WAVE_STRENGTH SUN_SHADING BLOCK_LIGHT BLOCKLIGHT_TEMP NIGHT_AMBIENT AVOID_DARK_LEVEL EYE_LIGHT NV_COLOR_R NV_COLOR_G NV_COLOR_B HAND_LIGHT ENTITY_TINT MATERIAL_GLOSS GLOSS_STRENGTH EMISSIVE_GLOW
screen.SHADOW_SCREEN = SHADOWS SHADOW_QTY_SLIDER SHADOW_DISTANCE_SLIDER SHADOW_SOFT SHADOW_BLUR COLORED_SHADOW SHADOW_LOCK
screen.SKY_SCREEN = SKY_SUN_GLOW SKY_STARS V_CLOUDS CLOUD_STEPS CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_COVERAGE
screen.AO_SCREEN = AO AO_STRENGTH AO_RADIUS AO_TAPS AO_FADE
screen.BLOOM_SCREEN = BLOOM BLOOM_STRENGTH BLOOM_RADIUS BLOOM_LOD
screen.DOF_SCREEN = DOF DOF_STRENGTH DOF_SAMPLES
screen.AA_SCREEN = AA_TYPE TAA_WEIGHT FXAA_EDGE
screen.MOTION_BLUR_SCREEN = MOTION_BLUR MOTION_BLUR_SAMPLES MOTION_BLUR_STRENGTH
screen.LIGHT_SCREEN = VOL_LIGHT VOL_LIGHT_SAMPLES VOL_LIGHT_STRENGTH AUTO_EXPOSURE AUTO_EXPOSURE_SPEED
screen.FOG_SCREEN = FOG_DENSITY UNDERWATER_FOG
screen.COLOUR_SCREEN = EXPOSURE SATURATION CONTRAST TONEMAP COLOR_R COLOR_G COLOR_B GAMMA DITHER CHROMA_ABER CHROMA_STRENGTH IMAGE_SHARPENING SHARPEN
screen.PALETTE_SCREEN = COLOR_SCHEME CUSTOM_ZENITH_R CUSTOM_ZENITH_G CUSTOM_ZENITH_B CUSTOM_HORIZON_R CUSTOM_HORIZON_G CUSTOM_HORIZON_B CUSTOM_AMBIENT CUSTOM_WATER_R CUSTOM_WATER_G CUSTOM_WATER_B
screen.ACCESSIBILITY_SCREEN = COLOR_BLINDNESS COLOR_BLIND_MODE

sliders = WAVE_SPEED WAVE_SCALE WAVE_STRENGTH WATER_OPACITY WATER_ABSORPTION FOG_DENSITY BLOCK_LIGHT NIGHT_AMBIENT AVOID_DARK_LEVEL NV_COLOR_R NV_COLOR_G NV_COLOR_B GLOSS_STRENGTH SHADOW_BLUR CLOUD_COVERAGE AO_STRENGTH AO_RADIUS AO_FADE BLOOM_STRENGTH BLOOM_RADIUS BLOOM_LOD DOF_STRENGTH TAA_WEIGHT FXAA_EDGE MOTION_BLUR_STRENGTH AUTO_EXPOSURE_SPEED VOL_LIGHT_STRENGTH CUSTOM_ZENITH_R CUSTOM_ZENITH_G CUSTOM_ZENITH_B CUSTOM_HORIZON_R CUSTOM_HORIZON_G CUSTOM_HORIZON_B CUSTOM_AMBIENT CUSTOM_WATER_R CUSTOM_WATER_G CUSTOM_WATER_B EXPOSURE SATURATION CONTRAST COLOR_R COLOR_G COLOR_B GAMMA CHROMA_STRENGTH SHARPEN

# ---- Vanilla features the pack takes over or turns off --------------------
vignette = false
underwaterOverlay = false
sun = true
moon = true
oldLighting = false
separateAo = false
dynamicHandLight = false
frustum.culling = true
shadow.culling = true
particles.before.deferred = true
clouds = fast

# The shadow pass exists, but it only runs when lib/config.glsl has SHADOWS 1.
program.shadow.enabled = SHADOWS

# Distant Horizons draws its own far terrain, and its shadow casters would need a
# second shadow map this pack does not have; its geometry is lit by the same shadow
# lookup as everything else, which reads as lit out there because it lies past the
# shadow distance anyway.
dhShadow.enabled = false

# Far water is translucent like near water.
blend.dh_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# One pass per effect family, each switched off when nothing in it can run:
#   deferred   copies the scene into gaux1 so water can refract it
#   composite  puts the shaded scene in colortex1 for the pass after it, and adds the
#              light shafts and the exposure average when those are on
#   composite2 antialiasing and motion blur (reads colortex1, writes colortex0)
#
# composite is not only for the shafts: composite2 and `final` both read the scene
# from colortex1, so it has to run whenever either of them does. Enabling it only for
# the shafts left the antialiasing pass reading a buffer nothing had written.
program.deferred.enabled = REFRACTION || WATER_SSR
program.composite.enabled = VOL_LIGHT || AUTO_EXPOSURE || AA_TYPE == 1 || AA_TYPE == 2 || MOTION_BLUR
# FXAA-only mode needs no history, so it runs in `final` and this pass is only for
# the modes that do: temporal AA, and motion blur.
program.composite2.enabled = (AA_TYPE == 1 || AA_TYPE == 2) || MOTION_BLUR

# ---- Blend state ----------------------------------------------------------
# Everything below is drawn on top of what is already in the buffer, with the
# alpha the program writes. Order matters: this is what makes water, glint,
# weather and the beam composite instead of punching holes.
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_skytextured = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_spidereyes = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_glowing = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_armor_glint = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_damagedblock = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
