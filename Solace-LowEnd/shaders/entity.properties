# Solace - entity.properties
#
# Entity ids the pack reads. Iris fills the `entityId` uniform for entity programs from
# this file; `mc_Entity` is a terrain attribute and carries none of these, which is why
# the geometry shader tests `entityId` and not `blockId`.
#
#   10101  lightning bolt - it is light, not a lit surface
#   10201  the fire an entity wears while burning - same
#
# Both ids are this pack's own choice; nothing outside these two files reads them.

entity.10101 = minecraft:lightning_bolt

entity.10201 = minecraft:entity_flame
