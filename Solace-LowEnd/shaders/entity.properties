# Solace - entity.properties
#
# Entity ids the pack reads. Iris fills `mc_Entity.x` for entity programs from this
# file, so without it the geometry shader has no way to know that a lightning bolt is
# a bolt and not a cow.
#
#   10101  lightning bolt - it is light, not a lit surface
#   10201  the fire an entity wears while burning - same
#
# Both are the ids the reference uses for the same two jobs.

entity.10101 = minecraft:lightning_bolt

entity.10201 = minecraft:entity_flame
