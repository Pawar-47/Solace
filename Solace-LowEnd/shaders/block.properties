# Solace - block.properties
#
# The only block ids this pack reads. They drive plant waving, the material gloss,
# the emissive boost and the end portal in lib/fragment_geometry.glsl. Written for
# vanilla blocks: nothing here needs a mod, and nothing else in the pack keys off a
# block id.
#
#   id 1  plants: grass, ferns, flowers, crops, saplings, sugar cane - they sway
#   id 2  leaves - they sway a little
#   id 3  metal - a strong gloss highlight
#   id 4  polished - a moderate gloss highlight
#   id 5  fabric - a soft sheen
#   id 6  emissive - the block is its own light, so it is never dimmed
#   id 7  end portal - the animated portal surface
#   id 8  water - waved, tinted, refracted
#   id 9  stained glass and ice - reflective but flat, because this pack shades
#         glass separately from water and does not ripple it
#   id 10 sand - the fourth gloss class, a very soft sheen
#
# Block names changed in 1.13, so there are two lists: modern names from 1.13 on, and
# the pre-1.13 names below them. The game's version decides which one is read.

