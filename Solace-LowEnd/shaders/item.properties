# Solace - item.properties
#
# Item ids the pack reads, in the same shape the reference uses for its held-item
# light: Iris fills `heldItemId` from these when the item is in either hand, and the
# geometry shader uses it to light the world around the player.
#
# `heldBlockLightValue` - the uniform that reports a light-emitting block in hand -
# says nothing about a torch held as an item, so without this file a torch in your
# hand lit nothing at all.
#
#   11001  a strong light in hand
#   11002  a weak one

item.11001 = minecraft:torch minecraft:soul_torch minecraft:copper_torch minecraft:lantern minecraft:soul_lantern minecraft:copper_lantern minecraft:exposed_copper_lantern minecraft:weathered_copper_lantern minecraft:oxidized_copper_lantern minecraft:waxed_copper_lantern minecraft:glowstone minecraft:sea_lantern minecraft:shroomlight minecraft:jack_o_lantern minecraft:beacon minecraft:end_rod minecraft:campfire minecraft:soul_campfire minecraft:lava_bucket minecraft:ochre_froglight minecraft:verdant_froglight minecraft:pearlescent_froglight minecraft:glow_berries

