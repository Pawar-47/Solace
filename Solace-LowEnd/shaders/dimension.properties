# Solace - dimension.properties
# Which folder belongs to which dimension. The names are the platform's, the
# folders here are thin: each holds an 8-line entry point that sets the dimension
# define and includes the shared library, which is where the palette changes.

dimension.world0 = minecraft:overworld
dimension.world-1 = minecraft:the_nether
dimension.world1 = minecraft:the_end
